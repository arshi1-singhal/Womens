kind = "web"
previewPath = "/"
title = "Shree"
description = "A supportive website for women to share stories anonymously, find India helplines and safety guidance, and create an opt-in location map link."
version = "1.0.0"
id = "artifacts/her-voice"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24547

[services.development]
run = "pnpm --filter @workspace/her-voice run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/her-voice", "run", "build" ]
serve = "static"
publicDir = "artifacts/her-voice/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24547"
BASE_PATH = "/"
